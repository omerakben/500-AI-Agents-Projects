name: Lint Cowork Business Folders

on:
  push:
    branches: ["main"]
    paths:
      - "cowork-business-folders/**"
      - ".github/workflows/cowork-folders-lint.yml"
  pull_request:
    paths:
      - "cowork-business-folders/**"
      - ".github/workflows/cowork-folders-lint.yml"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Lint all business folders against the standard
        working-directory: cowork-business-folders
        run: python tools/lint.py --all
